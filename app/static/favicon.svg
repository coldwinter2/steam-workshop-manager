<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Steam Mod 同步工具 favicon：深蓝底 + 品牌红「同步」环形箭头 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a4d"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#e94560"/>
    </linearGradient>
  </defs>
  <!-- 圆角深色底（与后台主题一致） -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="#2a2a4a" stroke-width="2"/>
  <!-- 同步箭头（双环形循环，Material sync 字形，矢量缩放居中） -->
